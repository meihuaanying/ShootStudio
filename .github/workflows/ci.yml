name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  analyze-test:
    name: Analyze & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure pub mirror (China)
        if: runner.os == 'Linux'
        run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> "$GITHUB_ENV"
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> "$GITHUB_ENV"

      - name: Ensure sqlite native lib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Ensure sqlite native lib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://www.sqlite.org/2026/sqlite-dll-win-x64-3530400.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite-dll.zip
          Expand-Archive sqlite-dll.zip -DestinationPath sqlite-dll -Force
          Copy-Item "sqlite-dll\sqlite3.dll" "C:\Windows\System32\sqlite3.dll"

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - name: "File size gate (R73 features <= 600, design <= 300)"
        run: node tool/check_file_size.mjs
      - name: "Design token gate (R71 no color/size/metric literals)"
        run: node tool/check_tokens.mjs --json=../docs/qa/v8-tokens.json
      - run: flutter analyze --fatal-infos
      - name: Engine aim math test (Node)
        run: node tool/test_aim.mjs
      - name: Gear pipeline offline selftest (R62)
        if: runner.os == 'Linux'
        env:
          GEAR_V3_OFFLINE: '1'
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/gear_photos_v3/selftest.py
      - name: Gear coverage gate (six kinds 100%, R68)
        if: runner.os == 'Linux'
        run: python3 tool/gear_coverage.py
      - name: Gear sources spot-check (R63/R70)
        if: runner.os == 'Linux'
        run: python3 tool/gear_sources_spotcheck.py
      - run: flutter test

  # D157/R82 官网视觉门禁：5 页 × 明暗 × 3 视口共 30 张截图，外加
  # announcements 通道读数与「禁止占位图」检查。
  # 放独立 job 而不是塞进 analyze-test：它需要 Node + Edge + npm install，
  # 与 Flutter 工具链无关，放一起会拖慢每个 matrix 单元。
  website-gate:
    name: Website gate (D157)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmmirror.com

      - name: Install Edge (Linux)
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" \
            | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable

      - name: Build web (Astro)
        working-directory: web
        run: |
          npm install
          npm run build
        env:
          PUBLIC_APP_VERSION: ci

      - name: Screenshot gate (30 shots + announcements + R82 no-placeholder)
        working-directory: web
        run: node tool/shot_s10.mjs

      - name: Verify evidence landed in git
        run: |
          test -f docs/qa/v8-s10-web-screenshots.json || {
            echo "缺少 docs/qa/v8-s10-web-screenshots.json"; exit 1; }
          n=$(ls docs/screenshots/v8/s10-web-*.png 2>/dev/null | wc -l)
          echo "s10 screenshots: $n"
          test "$n" -ge 30 || {
            echo "官网截图少于 30 张"; exit 1; }

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/x64/runner/Release/shoot_studio.exe")) {
            throw "Windows 构建产物缺失"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: app/build/windows/x64/runner/Release/
          retention-days: 7

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    env:
      # GitHub runner 在海外：直连官方 Maven 源，避免镜像 502 导致构建失败。
      SS_MAVEN_MIRROR: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

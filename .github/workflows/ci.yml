name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  analyze-test:
    name: Analyze & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure pub mirror (China)
        if: runner.os == 'Linux'
        run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> "$GITHUB_ENV"
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> "$GITHUB_ENV"

      - name: Ensure sqlite native lib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Ensure sqlite native lib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://www.sqlite.org/2026/sqlite-dll-win-x64-3530400.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite-dll.zip
          Expand-Archive sqlite-dll.zip -DestinationPath sqlite-dll -Force
          Copy-Item "sqlite-dll\sqlite3.dll" "C:\Windows\System32\sqlite3.dll"

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - name: "File size gate (R73 features <= 600, design <= 300)"
        run: node tool/check_file_size.mjs
      - name: "Design token gate (R71 no color/size/metric literals)"
        run: node tool/check_tokens.mjs --json=../docs/qa/v8-tokens.json
      - run: flutter analyze --fatal-infos
      - name: Engine aim math test (Node)
        run: node tool/test_aim.mjs
      - name: Gear pipeline offline selftest (R62)
        if: runner.os == 'Linux'
        env:
          GEAR_V3_OFFLINE: '1'
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/gear_photos_v3/selftest.py
      - name: Gear coverage gate (six kinds 100%, R68)
        if: runner.os == 'Linux'
        run: python3 tool/gear_coverage.py
      - name: Gear sources spot-check (R63/R70)
        if: runner.os == 'Linux'
        run: python3 tool/gear_sources_spotcheck.py
      - run: flutter test

  # D157/R82 官网视觉门禁：5 页 × 明暗 × 3 视口共 30 张截图，外加
  # announcements 通道读数与「禁止占位图」检查。
  # 放独立 job 而不是塞进 analyze-test：它需要 Node + Edge + npm install，
  # 与 Flutter 工具链无关，放一起会拖慢每个 matrix 单元。
  website-gate:
    name: Website gate (D157)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 必须 22+：shot_s10.mjs 走 CDP 需要 WebSocket，而 Node 20.20.2 两处
          # 都拿不到 —— node:http 不导出、也没有全局 WebSocket（全局是 22.4+ 才加的）。
          # V8.1.1 用 node-version: 20 在这里失败过一次：脚本自己的运行时解析
          # 正确报出「没有可用的 WebSocket 实现」并 exit 2，但门禁始终是红的。
          # 脚本里保留运行时解析作兜底，这里负责把版本给足。
          node-version: 22
          registry-url: https://registry.npmmirror.com

      - name: Install Edge (Linux)
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" \
            | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable

      - name: Build web (Astro)
        working-directory: web
        run: |
          npm install
          npm run build
        env:
          PUBLIC_APP_VERSION: ci

      - name: Screenshot gate (30 shots + announcements + R82 no-placeholder)
        working-directory: web
        run: node tool/shot_s10.mjs

      # 注意 working-directory：本文件顶部有 defaults.run.working-directory: app，
      # 而 shot_s10.mjs 把截图写进**仓库根**的 docs/（它自己按 repoRoot 解析）。
      # 不覆盖这一步就会在 app/ 里找 docs/，必然「缺少 json」。V8.1.2 在这里
      # 红过一次：截图本身 30/30 全过，只有这个校验步骤路径写错。
      - name: Verify evidence landed in git
        working-directory: ${{ github.workspace }}
        run: |
          test -f docs/qa/v8-s10-web-screenshots.json || {
            echo "缺少 docs/qa/v8-s10-web-screenshots.json"; exit 1; }
          n=$(ls docs/screenshots/v8/s10-web-*.png 2>/dev/null | wc -l)
          echo "s10 screenshots: $n"
          test "$n" -ge 30 || {
            echo "官网截图少于 30 张"; exit 1; }

  # P2 · 引擎性能门禁。
  #
  # 这里刻意**不设绝对帧耗时阈值**，理由不是「放宽」，而是统计上不成立：
  # GitHub runner 没有 GPU，同一指标在 SwiftShader 软渲染下的实测是
  #   docs/qa/v8-s2-engine-perf-swiftshader-dpr1.json
  #     idle engineFrames=2 p95=1500  orbit 3 1574
  #     lightDrag 3 1555            dolly 1 1469   fps=0.7
  # 每段只有 1~3 个采样点。在这种样本量上设「p95 <= N ms」，无论 N 取多少都是假门禁
  # （定得宽=永远绿，定得严=永远红）。合同 D152 的 16ms 口径本就登记为「独显实测」，
  # 见 docs/qa/v8-s2-engine-perf-gtx4060-dpr1.json（lightDrag p95 17.5ms + 偏差说明）。
  #
  # 因此本 job 守的是**CI 真能抓到的那些回归**：测量链路可用、引擎仍在出帧、
  # 统计字段仍是数值、预热确实 settled、灯体确实被拖到、帧数未相对入库基线灾难回退。
  # 反向验证已做：把 phase 的 engineFrames 改成 0，gate 立刻 FAIL 并 exit 1。
  #
  # node-version 用 22 与 website-gate 同因：engine_perf_qa.mjs 走 CDP 需要 WebSocket，
  # Node 20 两处都拿不到（V8.1.1 已在 shot_s10.mjs 上踩过并修过一次）。
  engine-gate:
    name: Engine perf gate
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmmirror.com

      - name: Install Edge (Linux)
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" \
            | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable

      - name: Engine perf gate (link + frames + stats + no catastrophic regression)
        run: node tool/engine_perf_gate.mjs

      # 产出留档：CI 侧的一次实测，便于人工复核软渲染环境下的绝对数字。
      - name: Upload CI perf evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-perf-ci
          path: docs/qa/v8-s2-engine-perf-ci-gate.json
          retention-days: 14
          if-no-files-found: warn


  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/x64/runner/Release/shoot_studio.exe")) {
            throw "Windows 构建产物缺失"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: app/build/windows/x64/runner/Release/
          retention-days: 7

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    env:
      # GitHub runner 在海外：直连官方 Maven 源，避免镜像 502 导致构建失败。
      SS_MAVEN_MIRROR: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
